schema: spec-driven

context: |
  Project: MyPrivateAgent
  Positioning: 企业级 Agent Runtime Control Plane，不是单一聊天 Demo，也不是 LangGraph/CrewAI/Qwen-Agent/OpenAI Agents SDK/DeerFlow 等外部框架的替代实现。
  External framework rule:
    - Mature agent frameworks are execution engines, lifecycle references, or adapter candidates.
    - Local Runtime Core, ToolRuntime, Query Control, Runtime Contract Gate, Governance Timeline, permission, audit, and business integration contracts remain the truth source.
    - New framework integrations must go through an OpenSpec adapter proposal and promotion gate before touching default main chat execution.
  Architecture truth sources:
    - docs/architecture/current_architecture.md
    - docs/architecture/runtime_contracts.md
    - docs/architecture/reference_project_mapping.md
    - docs/roadmap/next_phase_hardening.md
    - .specify/memory/constitution.md
  Core engineering rules:
    - Runtime Core terminology is a contract, not display copy.
    - Prefer backend read model / contract convergence over frontend local derivation.
    - Do not optimize local UI repeatedly after a phase completion line is reached.
    - External references are inputs, not blueprints.
    - External frameworks are adapter candidates, not project positioning.
    - When changing contracts, update docs and focused tests together.
    - Runtime/framework changes follow specification -> implementation -> archive -> git submission.
  Current phase bias:
    - Highest priority is Runtime Core and Query/Run Read Model convergence.
    - main_chat UI micro-optimizations are not top priority unless they unblock read model or contract clarity.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  proposal:
    - 必须包含“收口对象”和“非目标”。
    - 若影响 runtime contract、read model 或治理视图，必须明确列出受影响的后端 contract、前端消费点和文档真源。
    - 若借鉴外部项目，必须明确“借什么、不借什么、落到哪个模块”。
  tasks:
    - 默认按最小可验证切片拆分，不并行发散多个大方向。
    - 每组任务必须包含验证步骤和文档同步步骤。
    - 若改动属于低风险对外收口，不得直接推进到数据库迁移或内部兼容层重构。
  archive:
    - 归档前必须确认 roadmap 当前状态已同步。
    - 归档说明必须包含验证结果和仍未做的后续项。
