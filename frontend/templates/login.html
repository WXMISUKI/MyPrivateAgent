<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - MyPrivateAgent</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <h1>MyPrivateAgent</h1>
            <p class="subtitle">私有 AI 对话助手</p>

            <div class="tab-container">
                <div class="tab-buttons">
                    <button class="tab-btn active" data-tab="login">登录</button>
                    <button class="tab-btn" data-tab="register">注册</button>
                </div>

                <!-- 登录表单 -->
                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="login-username">用户名</label>
                        <input type="text" id="login-username" name="username" required
                               placeholder="请输入用户名" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="login-password">密码</label>
                        <input type="password" id="login-password" name="password" required
                               placeholder="请输入密码" autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-primary">登录</button>
                    <div id="login-error" class="error-message"></div>
                </form>

                <!-- 注册表单 -->
                <form id="register-form" class="auth-form" style="display: none;">
                    <div class="form-group">
                        <label for="register-username">用户名</label>
                        <input type="text" id="register-username" name="username" required
                               placeholder="请输入用户名（3-50字符）" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="register-password">密码</label>
                        <input type="password" id="register-password" name="password" required
                               placeholder="请输入密码（至少6字符）" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="register-confirm-password">确认密码</label>
                        <input type="password" id="register-confirm-password" name="confirm_password" required
                               placeholder="请再次输入密码" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-primary">注册</button>
                    <div id="register-error" class="error-message"></div>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
