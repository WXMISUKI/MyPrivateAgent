<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPrivateAgent</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Markdown渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 顶部栏 -->
        <header class="top-bar">
            <div class="app-title">MyPrivateAgent</div>
            <div class="header-actions">
                <button class="skills-button" id="skills-button">
                    <span>🧩</span>
                    <span id="skills-count">Skills: 0 | 0</span>
                </button>
                <button class="learnings-button" id="learnings-button">
                    <span>🧠</span>
                    <span id="learnings-count">学习记录</span>
                </button>
                <div class="user-menu">
                    <button class="user-button" id="user-button">
                        <span class="user-icon">👤</span>
                        <span class="user-name" id="current-username">用户</span>
                        <span class="dropdown-arrow">▼</span>
                    </button>
                    <div class="user-dropdown" id="user-dropdown">
                        <button class="logout-btn" id="logout-btn">退出登录</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="main-content">
            <!-- 左侧栏：会话列表 -->
            <aside class="sidebar">
                <button class="new-chat-btn" id="new-chat-btn">
                    <span>➕</span> 新建对话
                </button>
                <div class="conversation-list" id="conversation-list">
                    <!-- 会话列表将在这里动态生成 -->
                </div>
            </aside>

            <!-- 右侧栏：对话区域 -->
            <main class="chat-area">
                <!-- 模型选择和推理显示 -->
                <div class="model-selector">
                    <label for="model-select">模型：</label>
                    <select id="model-select">
                        <option value="doubao">豆包 (推荐)</option>
                        <option value="llama3.1">Llama 3.1</option>
                        <option value="deepseek-r1:7b">DeepSeek R1</option>
                        <option value="llava">LLaVA</option>
                    </select>
                    <div class="agent-mode-indicator" id="agent-mode-indicator" style="display: none;">
                        <span>🤖 智能体模式</span>
                    </div>
                    <div class="context-stats-indicator" id="context-stats-indicator" style="display: none;">
                        <span id="context-usage">Tokens: 0</span>
                    </div>
                </div>

                <!-- 聊天消息区域 -->
                <div class="messages-container" id="messages-container">
                    <div class="welcome-message" id="welcome-message">
                        <h2>欢迎使用 MyPrivateAgent</h2>
                        <p>开始一个新的对话吧！</p>
                    </div>
                </div>

                <!-- 权限确认对话框 -->
                <div class="permission-dialog" id="permission-dialog" style="display: none;">
                    <div class="permission-content">
                        <div class="permission-header">
                            <span class="permission-icon">🔐</span>
                            <span class="permission-title">Tool 权限请求</span>
                        </div>
                        <div class="permission-body">
                            <p class="permission-tool" id="permission-tool-name">工具名称</p>
                            <p class="permission-desc" id="permission-tool-desc">工具描述</p>
                            <pre class="permission-args" id="permission-tool-args">参数</pre>
                        </div>
                        <div class="permission-actions">
                            <button class="permission-deny" id="permission-deny-btn">拒绝</button>
                            <button class="permission-approve" id="permission-approve-btn">批准</button>
                        </div>
                    </div>
                </div>

                <!-- 输入区域 -->
                <div class="input-area">
                    <textarea
                        id="message-input"
                        placeholder="输入消息... (Shift+Enter 换行)"
                        rows="1"
                    ></textarea>
                    <button class="send-button" id="send-button">发送</button>
                </div>
            </main>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    
    <!-- Skills 管理面板 -->
    <div class="modal-overlay" id="skills-modal">
        <div class="modal-content skills-modal">
            <div class="modal-header">
                <h3>🧩 Skills 管理</h3>
                <button class="modal-close" id="skills-close">×</button>
            </div>
            <div class="modal-body">
                <div class="skills-stats" id="skills-stats">
                    <span>总数: <strong id="skills-total">0</strong></span>
                    <span>已启用: <strong id="skills-enabled">0</strong></span>
                    <div class="import-buttons">
                        <button class="btn-primary" id="import-skill-folder-btn" title="选择包含 SKILL.md 的文件夹，一键导入所有文件">📁 选择文件夹</button>
                        <button class="btn-secondary" id="import-skill-btn" title="上传 ZIP 压缩包或 SKILL.md 文件">📦 导入文件或ZIP压缩包</button>
                    </div>
                </div>
                <p style="font-size: 12px; color: #888; margin: 5px 0 10px;">
                    💡 推荐：选择文件夹（推荐） | ZIP压缩包 | 单个MD文件
                </p>
                <!-- 文件夹选择 -->
                <input type="file" id="skill-folder-input" webkitdirectory directory style="display: none;">
                <!-- 文件选择（支持 ZIP 和 MD） -->
                <input type="file" id="skill-file-input" accept=".md,.zip" style="display: none;">
                <div class="skills-list" id="skills-list">
                    <!-- Skills 列表将在这里动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 学习记录管理面板 -->
    <div class="modal-overlay" id="learnings-modal">
        <div class="modal-content learnings-modal">
            <div class="modal-header">
                <h3>🧠 学习记录管理</h3>
                <button class="modal-close" id="learnings-close">×</button>
            </div>
            <div class="modal-body">
                <!-- 统计信息 -->
                <div class="learnings-stats" id="learnings-stats">
                    <span>学习记录: <strong id="learnings-total">0</strong></span>
                    <span>待处理: <strong id="learnings-pending">0</strong></span>
                    <span>已解决: <strong id="learnings-resolved">0</strong></span>
                    <span>错误: <strong id="learnings-errors">0</strong></span>
                    <span>功能请求: <strong id="learnings-features">0</strong></span>
                </div>
                
                <!-- 操作按钮 -->
                <div class="learnings-actions">
                    <button class="btn-primary" id="run-daily-review-btn">📊 运行每日复盘</button>
                    <button class="btn-secondary" id="run-auto-promote-btn">🚀 自动提升学习记录</button>
                    <button class="btn-secondary" id="create-learning-btn">➕ 手动添加学习记录</button>
                </div>
                
                <!-- 选项卡 -->
                <div class="learnings-tabs">
                    <button class="tab-btn active" data-tab="learnings">学习记录</button>
                    <button class="tab-btn" data-tab="errors">错误记录</button>
                    <button class="tab-btn" data-tab="features">功能请求</button>
                    <button class="tab-btn" data-tab="trends">趋势分析</button>
                </div>
                
                <!-- 选项卡内容 -->
                <div class="learnings-tab-content">
                    <!-- 学习记录选项卡 -->
                    <div class="tab-panel active" id="tab-learnings">
                        <div class="filter-bar">
                            <select id="learning-status-filter">
                                <option value="">全部状态</option>
                                <option value="pending">待处理</option>
                                <option value="resolved">已解决</option>
                                <option value="promoted">已提升</option>
                            </select>
                            <select id="learning-category-filter">
                                <option value="">全部类别</option>
                                <option value="correction">纠正</option>
                                <option value="insight">洞察</option>
                                <option value="knowledge_gap">知识差距</option>
                                <option value="best_practice">最佳实践</option>
                            </select>
                        </div>
                        <div class="learnings-list" id="learnings-list">
                            <!-- 学习记录列表将在这里动态生成 -->
                        </div>
                    </div>
                    
                    <!-- 错误记录选项卡 -->
                    <div class="tab-panel" id="tab-errors">
                        <div class="filter-bar">
                            <select id="error-status-filter">
                                <option value="">全部状态</option>
                                <option value="pending">待处理</option>
                                <option value="resolved">已解决</option>
                            </select>
                        </div>
                        <div class="errors-list" id="errors-list">
                            <!-- 错误记录列表将在这里动态生成 -->
                        </div>
                    </div>
                    
                    <!-- 功能请求选项卡 -->
                    <div class="tab-panel" id="tab-features">
                        <div class="filter-bar">
                            <select id="feature-status-filter">
                                <option value="">全部状态</option>
                                <option value="pending">待处理</option>
                                <option value="resolved">已实现</option>
                            </select>
                        </div>
                        <div class="features-list" id="features-list">
                            <!-- 功能请求列表将在这里动态生成 -->
                        </div>
                    </div>
                    
                    <!-- 趋势分析选项卡 -->
                    <div class="tab-panel" id="tab-trends">
                        <div class="trends-controls">
                            <label>统计天数: <input type="number" id="trends-days" value="7" min="1" max="30"></label>
                            <button class="btn-secondary" id="refresh-trends-btn">刷新趋势</button>
                        </div>
                        <div class="trends-content" id="trends-content">
                            <!-- 趋势分析内容将在这里动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 创建学习记录表单 -->
    <div class="modal-overlay" id="create-learning-modal">
        <div class="modal-content create-learning-modal">
            <div class="modal-header">
                <h3>➕ 创建学习记录</h3>
                <button class="modal-close" id="create-learning-close">×</button>
            </div>
            <div class="modal-body">
                <form id="create-learning-form">
                    <div class="form-group">
                        <label for="learning-category">类别 *</label>
                        <select id="learning-category" required>
                            <option value="">选择类别</option>
                            <option value="correction">纠正</option>
                            <option value="insight">洞察</option>
                            <option value="knowledge_gap">知识差距</option>
                            <option value="best_practice">最佳实践</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="learning-priority">优先级 *</label>
                        <select id="learning-priority" required>
                            <option value="low">低</option>
                            <option value="medium" selected>中</option>
                            <option value="high">高</option>
                            <option value="critical">关键</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="learning-summary">摘要 *</label>
                        <textarea id="learning-summary" rows="2" required placeholder="简要描述学习内容"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="learning-details">详细信息</label>
                        <textarea id="learning-details" rows="4" placeholder="详细描述学习内容"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="learning-action">建议行动</label>
                        <textarea id="learning-action" rows="2" placeholder="建议采取的行动"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="cancel-create-learning">取消</button>
                        <button type="submit" class="btn-primary">创建</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
