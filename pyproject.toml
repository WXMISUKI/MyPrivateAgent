[project]
name = "myprivateagent"
version = "0.1.0"
description = "MyPrivateAgent unified Vercel deployment"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.115.0",
  "pydantic==2.13.1",
  "pydantic-core==2.46.1",
  "python-dotenv==1.0.1",
  "python-json-logger==2.0.7"
]

[project.scripts]
app = "api.index:app"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E", "F", "W", "I"]
