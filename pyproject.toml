[project]
name = "myprivateagent"
version = "0.1.0"
description = "MyPrivateAgent unified Vercel deployment"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn==0.30.6",
  "gunicorn==21.2.0",
  "sqlalchemy==2.0.35",
  "pymysql==1.1.1",
  "cryptography==44.0.0",
  "pydantic==2.13.1",
  "pydantic-core==2.46.1",
  "pydantic-settings==2.6.1",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "python-multipart==0.0.12",
  "python-dotenv==1.0.1",
  "langchain==0.3.7",
  "langchain-ollama==0.2.0",
  "langchain-openai==0.2.14",
  "langgraph==0.2.56",
  "openai==1.58.1",
  "pytz==2024.2",
  "httpx>=0.27.0",
  "alembic==1.13.1",
  "python-json-logger==2.0.7",
  "tiktoken==0.7.0",
  "slowapi==0.1.9"
]

[project.scripts]
app = "api.index:app"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E", "F", "W", "I"]
